name: Auto-assign Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-assign:
    name: Auto-assign new issues
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign issue
        uses: kentaro-m/auto-assign-action@v2
        with:
          configuration-path: '.github/auto_assign.yml'
